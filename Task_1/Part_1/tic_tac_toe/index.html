<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
  </head>
  <body class="min-h-screen bg-gray-950 flex flex-col items-center">
    <h1 class="text-white text-7xl mt-5 font-mono font-bold">Tic Tac Toe </h1>  

    <div id="select" class="flex flex-col justify-center flex-1 space-y-5">
      <button id="onevsone" class="bg-purple-600 text-white px-8 py-4 rounded-4xl font-extrabold text-5xl transform transition-transform duration-300 hover:bg-purple-700 hover:scale-110">Player1 VS Player2</button>
      <button id="onevsbot" class="bg-purple-600 text-white px-8 py-4 rounded-4xl font-extrabold text-5xl transform transition-transform duration-300 hover:bg-purple-700 hover:scale-110">Player VS Computer</button>
    </div>

    <div id="mode" class="text-white text-3xl font-bold mt-5">

    </div>

    <div id="grid" class="grid grid-cols-3 gap-5 mt-3">

    </div>

    <div id="reset">

    </div>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
