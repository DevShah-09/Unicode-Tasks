{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title_page %}My Diary{% endblock %}
  </title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <div class="container">
    <h1 class="heading">{% block header %}My Personal Diary{% endblock %}</h1>
    <div class="nav">
      <a class="link-1" href="{% url 'entry_list' %}">All Entries</a>
      <a class="link-2" href="{% url 'entry_form_create' %}">Create a New Entry</a>
    </div>

    <div class="main">
      {% block content %}{% endblock %}
    </div>
  </div>

  
</body>
</html>
