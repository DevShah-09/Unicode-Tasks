{% extends "base.html" %}

{% block title_page %}Delete Entry{% endblock %}

{% block header %}Delete Entry{% endblock %}

{% block content %}
  <p>Are you sure you want to delete <strong>{{ curr.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'entry_detail' curr.id %}">Cancel</a>
  </form>
{% endblock %}
